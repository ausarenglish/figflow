# Auto-report to the designer when a preview deploy goes live.
#
# Copy into .github/workflows/ of the app repo (not figflow's).
#
# This is the piece that makes the loop hands-free: you run `figflow start`
# before you begin, push, and the designer is notified the moment the preview
# is actually up — not when the code was written.
#
# Requires:
#   - secrets.FIGMA_TOKEN with file_comments:write (and file_dev_resources:write
#     if you are on a paid Figma plan and want links pinned to the frame)
#   - .figflow/state.json committed, with threads already marked via `figflow start`

name: figflow report

on:
  deployment_status:

permissions:
  contents: write
  pull-requests: read

jobs:
  report:
    # Only when a deploy actually succeeded and has a URL to send people to.
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest

    steps:
      # Vercel's deployment event carries a commit SHA and an empty payload —
      # no branch name anywhere.
      #
      # Resolve the branch from the commit itself, NOT from its pull request:
      # plenty of repos merge branches directly and have no PRs at all, and
      # there the PR lookup skips every deploy forever. A PR, when one exists,
      # is a bonus that gets the reply a PR link.
      - name: Resolve branch and PR from the deployed commit
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" "$1"; }
          REPO="https://api.github.com/repos/${{ github.repository }}"

          branch=$(api "$REPO/commits/$SHA/branches-where-head" | jq -r '.[0].name // empty')
          if [ -z "$branch" ]; then
            # The branch moved on after this deploy started, so this build is
            # already stale. Reporting it would point the designer at old code.
            echo "$SHA is not the head of any branch — stale deploy, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr=$(api "$REPO/commits/$SHA/pulls" | jq -r '.[0].number // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Resolved $SHA → branch '$branch', PR '${pr:-none}'"

      # Check out the branch, not the SHA: the state commit at the end needs a
      # branch to push to, and a detached HEAD cannot.
      - uses: actions/checkout@v4
        if: steps.ctx.outputs.skip != 'true'
        with:
          ref: ${{ steps.ctx.outputs.branch }}

      - uses: actions/setup-node@v4
        if: steps.ctx.outputs.skip != 'true'
        with:
          node-version: 24

      - name: Install figflow
        if: steps.ctx.outputs.skip != 'true'
        run: npm install -g github:ausarenglish/figflow

      - name: Report to Figma
        if: steps.ctx.outputs.skip != 'true'
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          # environment_url is the real deployed URL, so no branch-slug guessing.
          # --allow-empty: most pushes have no design threads attached, and that
          # is not a failure.
          PR_ARG=""
          [ -n "${{ steps.ctx.outputs.pr }}" ] && PR_ARG="--pr ${{ steps.ctx.outputs.pr }}"
          figflow report \
            --branch "${{ steps.ctx.outputs.branch }}" \
            $PR_ARG \
            --preview "${{ github.event.deployment_status.environment_url }}" \
            --allow-empty \
            --post

      - name: Commit updated state
        if: steps.ctx.outputs.skip != 'true'
        run: |
          if [[ -n "$(git status --porcelain .figflow/state.json)" ]]; then
            git config user.name "figflow"
            git config user.email "figflow@users.noreply.github.com"
            git add .figflow/state.json
            git commit -m "chore(figflow): record reports for ${{ steps.ctx.outputs.branch }}"
            # The branch may have moved while the deploy ran.
            git pull --rebase --autostash origin "${{ steps.ctx.outputs.branch }}"
            git push
          fi
